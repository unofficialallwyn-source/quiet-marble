name: Deploy Azure beta
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm test
      - run: npm run build
      - run: npm run check:api
      - run: npm prune --omit=dev --prefix api
      - name: Check deployment token
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: test -n "$SWA_TOKEN" || { echo 'Add the Azure deployment token to the production environment secrets.'; exit 1; }
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ''
          api_location: api
          skip_app_build: true
          skip_api_build: true
