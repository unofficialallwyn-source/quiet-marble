name: Validate game and API
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm test
      - run: npm run build
      - run: npm run check:api
  sql-retention:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Qm_CI_Only_2026_Test!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix api
      - run: node --import tsx --test api/tests/retention.test.ts api/tests/moderation.test.ts
        env:
          SQL_TEST_PASSWORD: Qm_CI_Only_2026_Test!
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Expo's own project check (missing native peer dependencies, config schema, versions).
      - run: npx --yes expo-doctor
      - run: npm test -- --ci
      # Bundles the app for both platforms, proving Metro can load shared/ game logic.
      - run: npm run export:check
        env:
          EXPO_OFFLINE: '1'
          EXPO_NO_TELEMETRY: '1'
