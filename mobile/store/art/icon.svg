<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
 <!-- Quiet Marble app icon: the website's five-marble cross on a warm board. -->
 <defs>
  <radialGradient id="board" cx="35%" cy="25%" r="85%"><stop offset="0" stop-color="#f3ead2"/><stop offset="1" stop-color="#e2d3ab"/></radialGradient>
  <radialGradient id="marble" cx="34%" cy="28%" r="70%"><stop offset="0" stop-color="#c8e3be"/><stop offset=".18" stop-color="#92b78a"/><stop offset=".52" stop-color="#4c7957"/><stop offset=".78" stop-color="#31553e"/><stop offset="1" stop-color="#233d2e"/></radialGradient>
  <radialGradient id="hole" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#8f7c55"/><stop offset="1" stop-color="#ad996d"/></radialGradient>
 </defs>
 <rect width="1024" height="1024" fill="url(#board)"/>
 <g id="marbles">
  <g fill="url(#hole)">
   <circle cx="512" cy="272" r="112"/><circle cx="272" cy="512" r="112"/><circle cx="512" cy="512" r="112"/><circle cx="752" cy="512" r="112"/><circle cx="512" cy="752" r="112"/>
  </g>
  <g fill="url(#marble)" stroke="#294c33" stroke-width="4">
   <circle cx="512" cy="272" r="100"/><circle cx="272" cy="512" r="100"/><circle cx="512" cy="512" r="100"/><circle cx="752" cy="512" r="100"/><circle cx="512" cy="752" r="100"/>
  </g>
 </g>
</svg>
